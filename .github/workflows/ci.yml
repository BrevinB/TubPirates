name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast, cheap, always: the engine is pure Swift with no UI dependencies.
  engine-tests:
    name: Engine tests
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Run BathtubEngine tests
        run: swift test --package-path Packages/BathtubEngine

  # Heavier: full app build against the iOS simulator SDK. No signing in CI.
  build-app:
    name: Build app
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Build for iOS Simulator
        run: |
          xcodebuild -project TubPirates.xcodeproj -scheme TubPirates \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
