<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2064px; height: 2752px; overflow: hidden; }
  .canvas {
    position: relative;
    width: 2064px; height: 2752px;
    background: url("../bg-aqua/bg-master.png") center bottom / cover no-repeat;
  }
  .headline {
    position: absolute;
    top: 110px; left: 0; right: 0;
    text-align: center;
    font-family: "Arial Rounded MT Bold", "SF Pro Rounded", -apple-system, sans-serif;
    font-size: 118px;
    line-height: 1.08;
    color: #123A5C;
    letter-spacing: -1px;
    text-shadow: 0 4px 0 rgba(255,255,255,0.85);
  }
  .headline .accent { color: #E8618C; }
  .pad {
    position: absolute;
    left: 50%; top: 470px;
    width: 1520px;
    transform: translateX(-50%) rotate(TILTdeg);
    border-radius: 84px;
    background: #1b2733;
    padding: 26px;
    box-shadow: 0 60px 110px rgba(18, 58, 92, 0.38),
                0 18px 40px rgba(18, 58, 92, 0.25);
  }
  .screen {
    display: block;
    width: 100%;
    border-radius: 60px;
    overflow: hidden;
  }
  .screen img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="headline">HEADLINE_HTML</div>
    <div class="pad">
      <div class="screen"><img src="SCREEN_SRC"></div>
    </div>
  </div>
</body>
</html>
