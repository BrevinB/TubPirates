<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1320px; height: 2868px; overflow: hidden; }
  .canvas {
    position: relative;
    width: 1320px; height: 2868px;
    background: url("../bg-aqua/bg-master.png") center / cover no-repeat;
  }
  .headline {
    position: absolute;
    top: 130px; left: 0; right: 0;
    text-align: center;
    font-family: "Arial Rounded MT Bold", "SF Pro Rounded", -apple-system, sans-serif;
    font-size: 128px;
    line-height: 1.08;
    color: #123A5C;
    letter-spacing: -1px;
    text-shadow: 0 4px 0 rgba(255,255,255,0.85);
  }
  .headline .accent { color: #E8618C; }
  .phone {
    position: absolute;
    left: 50%; top: 520px;
    width: 1020px;
    transform: translateX(-50%) rotate(TILTdeg);
    border-radius: 150px;
    background: #1b2733;
    padding: 22px;
    box-shadow: 0 60px 110px rgba(18, 58, 92, 0.38),
                0 18px 40px rgba(18, 58, 92, 0.25);
  }
  .screen {
    display: block;
    width: 100%;
    border-radius: 128px;
    overflow: hidden;
  }
  .screen img { display: block; width: 100%; }
  .island {
    position: absolute;
    top: 52px; left: 50%;
    transform: translateX(-50%);
    width: 260px; height: 74px;
    border-radius: 40px;
    background: #10161d;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="headline">HEADLINE_HTML</div>
    <div class="phone">
      <div class="screen"><img src="SCREEN_SRC"></div>
      <div class="island"></div>
    </div>
  </div>
</body>
</html>
